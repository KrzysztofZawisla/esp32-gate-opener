[licenses]
# Permissive licenses only: this firmware is distributed under ISC, so no
# copyleft or source-disclosure obligations are acceptable from dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8
# Keep the allowlist forward-looking; do not fail CI just because a listed
# license is not present in the current lockfile.
unused-allowed-license = "allow"

[advisories]
version = 2

[bans]
multiple-versions = "warn"
