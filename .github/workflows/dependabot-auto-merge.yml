# Auto-merge Dependabot pull requests once the required CI checks pass.
#
# Tripped for every non-draft PR from the Dependabot bot. It approves the PR and
# flips on GitHub's native auto-merge (`gh pr merge --auto`), so the PR is merged
# as soon as all *required* status checks (from `.github/workflows/ci.yml`) pass.
#
# Repository/branch setup required for this to behaviour:
#   1. Settings > General > Pull requests > "Allow auto-merge" (on).
#   2. A branch protection rule on the default branch that *requires* the CI
#      status checks to succeed. If it also requires reviews, the approve step
#      below satisfies that; set "Require branches to be up to date" if you want a
#      merge only once the latest commit is green.

name: Dependabot auto-merge
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && !github.event.pull_request.draft
    steps:
      - name: Approve the Dependabot pull request
        run: gh pr review "$PR_URL" --approve
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for the Dependabot pull request
        run: gh pr merge "$PR_URL" --auto --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}