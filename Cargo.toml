[package]
name = "esp32-gate-opener"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "esp32-gate-opener"
harness = false
test = false

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[dependencies]
anyhow = "1"
log = "0.4"

# ESP-IDF v5.3-compatible crate set (esp-idf-hal 0.46+/esp-idf-svc 0.52+ target
# IDF 5.2/6.0 and do not compile against 5.3.x bindings; 0.45/0.51/0.28/0.36 is
# the official 5.3 line).
[target.'cfg(target_os = "espidf")'.dependencies]
embassy-futures = "0.1.2"
embassy-time = { version = "0.4", features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = { version = "=0.1.0", features = ["generic-queue-64"] }
embedded-svc = "0.28"
esp-idf-hal = { version = "0.45" }
esp-idf-svc = { version = "0.51", features = ["critical-section", "embassy-time-driver"] }
esp-idf-sys = "0.36"
